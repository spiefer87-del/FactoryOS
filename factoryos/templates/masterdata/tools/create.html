{% extends "layout/base.html" %}

{% block content %}

<h2 style="margin-bottom:25px">Werkzeug anlegen</h2>

<div class="form-card">

<form method="POST">

<div class="form-grid">

<div class="form-group">
<label>Werkzeugnummer</label>
<input type="text" name="tool_no" required>
</div>


<div class="form-group">
    <label>Werkzeugname</label>
    <input type="text" name="name">
</div>

<div class="form-group full">
    <label>Beschreibung</label>
    <textarea name="description"></textarea>
</div>



<div class="form-group">
    <label>Kavitäten</label>
    <input type="number" name="cavities">
</div>


<div class="form-group">
<label>Lagerort</label>
<input type="text" name="location">
</div>

<div class="form-group">
<label>Status</label>
<select name="tool_status">

<option value="aktiv">Aktiv</option>
<option value="wartung">Wartung</option>
<option value="defekt">Defekt</option>

</select>
</div>

</div>

<div class="form-actions">

<button class="btn-primary">
Werkzeug speichern
</button>

<a href="{{ url_for('tools.list_tools') }}" class="btn-secondary">
Abbrechen
</a>

</div>

</form>

</div>

{% endblock %}
