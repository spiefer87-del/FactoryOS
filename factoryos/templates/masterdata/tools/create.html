{% extends "layout/base.html" %}

{% block content %}

<h2 style="margin-bottom:25px;">Werkzeug anlegen</h2>

<div class="form-card">

<form method="POST" enctype="multipart/form-data">

<div class="form-grid">

<!-- ================================== -->
<!-- 🔹 IDENTIFIKATION -->
<!-- ================================== -->

<div class="full">
    <h3 class="section-title">Identifikation</h3>
</div>

<div class="form-group">
    <label>Werkzeugnummer *</label>
    <input type="text" name="tool_no" required>
</div>

<div class="form-group">
    <label>Externe Werkzeugnummer</label>
    <input type="text" name="external_tool_no">
</div>

<div class="form-group">
    <label>Werkzeugname</label>
    <input type="text" name="name">
</div>

<div class="form-group">
    <label>Form gebaut von</label>
    <input type="text" name="built_by">
</div>

<div class="form-group">
    <label>Baujahr</label>
    <input type="number" name="build_year">
</div>

<div class="form-group">
    <label>Schusszähler</label>
    <input type="number" name="shot_counter">
</div>

<div class="form-group full">
    <label>Beschreibung</label>
    <textarea name="description"></textarea>
</div>

<hr class="full">


<!-- ================================== -->
<!-- 🔹 TECHNISCHE DATEN -->
<!-- ================================== -->

<div class="full">
    <h3 class="section-title">Technische Daten</h3>
</div>

<div class="form-group">
    <label>Kavitäten</label>
    <input type="number" name="cavities">
</div>

<div class="form-group">
    <label>Kernzüge vorhanden?</label>
    <select name="has_core_pulls" id="has_core_pulls">
        <option value="0">Nein</option>
        <option value="1">Ja</option>
    </select>
</div>

<div class="form-group hidden" id="core_pull_group">
    <label>Anzahl Kernzüge</label>
    <input type="number" name="core_pulls">
</div>

<div class="form-group">
    <label>Heißkanal vorhanden?</label>
    <select name="has_hotrunner" id="has_hotrunner">
        <option value="0">Nein</option>
        <option value="1">Ja</option>
    </select>
</div>

<div class="form-group hidden" id="hotrunner_group">
    <label>Heißkanalzonen</label>
    <input type="number" name="hotrunner_zones">
</div>

<hr class="full">


<!-- ================================== -->
<!-- 🔹 ABMESSUNGEN -->
<!-- ================================== -->

<div class="full">
    <h3 class="section-title">Abmessungen</h3>
</div>

<div class="form-group">
    <label>Gewicht (kg)</label>
    <input type="number" step="0.01" name="tool_weight_kg">
</div>

<div class="form-group">
    <label>Länge (mm)</label>
    <input type="number" step="0.01" name="tool_length_mm">
</div>

<div class="form-group">
    <label>Breite (mm)</label>
    <input type="number" step="0.01" name="tool_width_mm">
</div>

<div class="form-group">
    <label>Höhe (mm)</label>
    <input type="number" step="0.01" name="tool_height_mm">
</div>

<hr class="full">


<!-- ================================== -->
<!-- 🔹 AUSSTATTUNG -->
<!-- ================================== -->

<div class="full">
    <h3 class="section-title">Ausstattung</h3>
</div>

<div class="form-group">
    <label>Zentrierung Düsenseite</label>
    <input type="text" name="centering_nozzle_side">
</div>

<div class="form-group">
    <label>Zentrierung Auswerferseite</label>
    <input type="text" name="centering_ejector_side">
</div>

<div class="form-group">
    <label>Auswerferanschluss</label>
    <input type="text" name="ejector_connection">
</div>

<div class="form-group">
    <label>Entformungsart</label>
    <input type="text" name="demolding_type">
</div>

<div class="form-group">
    <label>Automatisierung</label>
    <input type="text" name="automation_type">
</div>

<div class="form-group checkbox">
    <label>
        <input type="checkbox" name="has_conversion_kit">
        Umbausatz vorhanden
    </label>
</div>

<hr class="full">


<!-- ================================== -->
<!-- 🔹 ORGANISATION -->
<!-- ================================== -->

<div class="full">
    <h3 class="section-title">Organisation</h3>
</div>

<div class="form-group">
    <label>Lagerort</label>
    <input type="text" name="location">
</div>

<div class="form-group">
    <label>Status</label>
    <select name="tool_status">
        {% for key, label in TOOL_STATUSES.items() %}
            <option value="{{ key }}">{{ label }}</option>
        {% endfor %}
    </select>
</div>

<hr class="full">


<!-- ================================== -->
<!-- 🔹 BILDER -->
<!-- ================================== -->

<div class="full">
    <h3 class="section-title">Bilder</h3>
</div>

<div class="form-group full">
    <label>Bilder hochladen</label>
    <input type="file" name="images" multiple accept="image/*">
</div>

</div>


<!-- ================================== -->
<!-- ACTIONS -->
<!-- ================================== -->

<div class="form-actions">
    <button type="submit" class="btn-primary">Speichern</button>
    <a href="{{ url_for('tools.list_tools') }}" class="btn-secondary">Abbrechen</a>
</div>

</form>
</div>


<!-- ================================== -->
<!-- JS -->
<!-- ================================== -->

<script>
document.addEventListener("DOMContentLoaded", function () {

    const hotrunner = document.getElementById("has_hotrunner");
    const hotrunnerGroup = document.getElementById("hotrunner_group");

    const corepull = document.getElementById("has_core_pulls");
    const coreGroup = document.getElementById("core_pull_group");

    function toggleFields() {
        hotrunnerGroup.classList.toggle("hidden", hotrunner.value !== "1");
        coreGroup.classList.toggle("hidden", corepull.value !== "1");
    }

    hotrunner.addEventListener("change", toggleFields);
    corepull.addEventListener("change", toggleFields);

    toggleFields();
});
</script>

{% endblock %}
