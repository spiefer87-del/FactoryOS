<div class="form-grid">
    <div class="form-group"><label for="masterbatch_id">Farbbatch (Materialstamm, optional)</label><select id="masterbatch_id" name="masterbatch_id"><option value="">Kein Farbbatch</option>{% for batch in materials if batch.material_type=='masterbatch' %}<option value="{{ batch.id }}" {% if article and article.masterbatch_id==batch.id %}selected{% endif %}>{{ batch.material_no }} – {{ batch.name }} · {{ batch.color or '' }} · {{ batch.ral_color or '' }}</option>{% endfor %}</select><small>Farbe und RAL werden zentral am Masterbatch gepflegt.</small></div>
    <div class="form-group"><label for="masterbatch_percent">Farbbatch-Zugabe (%) (optional)</label><input type="number" id="masterbatch_percent" name="masterbatch_percent" min="0" max="100" step="any" value="{{ article.masterbatch_percent if article and article.masterbatch_percent is not none else '' }}"><small>Bezogen auf das Hauptrohstoffgewicht: 2 % = 2 kg Farbbatch je 100 kg Hauptrohstoff.</small></div>
    <div class="form-group">
        <label for="material_id">Rohstoff (optional)</label>
        <select id="material_id" name="material_id">
            <option value="">Kein Rohstoff zugeordnet</option>
            {% for material in materials if material.material_type!='masterbatch' %}
            <option value="{{ material.id }}" {% if article and article.material_id == material.id %}selected{% endif %}>{{ material.material_no }} – {{ material.name }}{% if material.polymer_type %} · {{ material.polymer_type }}{% endif %}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label for="customer_id">Kunde (optional)</label>
        <select id="customer_id" name="customer_id">
            <option value="">Keine Kundenzuordnung</option>
            {% for customer in customers %}
            <option value="{{ customer.id }}" {% if article and article.customer_id == customer.id %}selected{% endif %}>{{ customer.customer_no }} – {{ customer.name }}{{ ' (inaktiv)' if not customer.active else '' }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Artikelnummer</label>
        <input type="text" name="article_no"
               value="{{ article.article_no if article else '' }}"
               required>
    </div>

    <div class="form-group">
        <label>Artikelname</label>
        <input type="text" name="article_name"
               value="{{ article.article_name if article else '' }}"
               required>
    </div>
    
    <div class="form-group">
        <label>Zeichnungsnummer</label>
    
        <input
            type="text"
            name="drawing_no"
            value="{{ article.drawing_no if article else '' }}">
    </div>
    
    <div class="form-group">
        <label>Zeichnungsrevision</label>
    
        <input
            type="text"
            name="drawing_revision"
            value="{{ article.drawing_revision if article else '' }}">
    </div>

    <div class="form-group full">
    <label>Werkzeuge</label>

    <select id="tool-select" name="tools" multiple>
        {% for tool in tools %}
            <option value="{{ tool.id }}"
                {% if article and tool in article.tools %}selected{% endif %}>
                {{ tool.tool_no }} - {{ tool.name or '' }}
            </option>
        {% endfor %}
    </select>
    </div>
    
    <div class="form-group full">
        <label>Beschreibung</label>
        <textarea name="description" rows="3">{{ article.description if article else '' }}</textarea>
    </div>

    <div class="form-group">
        <label>Status</label>
        <select name="status">
            <option value="active"
                {% if article and article.status == "active" %}selected{% endif %}>
                Aktiv
            </option>
            <option value="inactive"
                {% if article and article.status == "inactive" %}selected{% endif %}>
                Inaktiv
            </option>
        </select>
    </div>

    <!-- Produktionsdaten -->
    <div class="form-group">
        <label>Schussgewicht (g)</label>
        <input type="number" step="0.01" name="shot_weight_g"
               value="{{ article.shot_weight_g if article else '' }}">
    </div>

    <div class="form-group">
        <label>Zykluszeit (s)</label>
        <input type="number" step="0.01" name="cycle_time_s"
               value="{{ article.cycle_time_s if article else '' }}">
    </div>

    <div class="form-group">
        <label>Verpackungseinheit</label>
        <input type="number" name="pack_unit"
               value="{{ article.pack_unit if article else '' }}">
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    if (typeof TomSelect !== "undefined") {
        ["customer_id", "material_id", "masterbatch_id"].forEach(function(id) {
            new TomSelect("#" + id, {
                create: false, maxItems: 1, allowEmptyOption: true,
                plugins: ["clear_button"],
                placeholder: id === "customer_id" ? "Kundennummer oder Name suchen …" : "Rohstoff suchen …"
            });
        });
    }

    const originalTools = {{ article.tools|map(attribute='id')|list|tojson if article else '[]' }};

    const select = new TomSelect("#tool-select", {
        plugins: ['remove_button'],
        maxItems: null,
        create: false,
        placeholder: "Werkzeug suchen...",

        onItemRemove: function(value) {
            if (!confirm("Werkzeug wirklich entfernen?")) {
                this.addItem(value); // wieder zurück
            }
        }
    });

    // =========================
    // 🚨 Submit Check (zusätzliche Sicherheit)
    // =========================

    document.querySelector("form").addEventListener("submit", function(e) {

        const current = select.getValue(); // Array

        const removed = originalTools.filter(id => !current.includes(id.toString()));

        if (removed.length > 0) {
            if (!confirm("Achtung: Es werden Werkzeuge entfernt. Fortfahren?")) {
                e.preventDefault();
            }
        }
    });

});
</script>
