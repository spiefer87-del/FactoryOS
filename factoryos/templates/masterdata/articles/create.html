{% extends "layout/base.html" %}

{% block content %}

<h2>Artikel anlegen</h2>

<div class="form-container">

<form method="POST">

<div class="form-grid">

<div class="form-group">
<label>Artikelnummer</label>
<input type="text" name="article_no" required>
</div>

<div class="form-group">
<label>Artikelname</label>
<input type="text" name="article_name" required>
</div>

<div class="form-group full">
    <label>Werkzeuge</label>

    <div class="checkbox-list">
        {% for tool in tools %}
            <label>
                <input type="checkbox" name="tool_ids" value="{{ tool.id }}">
                {{ tool.tool_no }} - {{ tool.name or "-" }}
            </label>
        {% endfor %}
    </div>
</div>

<div class="form-group full">
<label>Beschreibung</label>
<textarea name="description" rows="3"></textarea>
</div>

<label>Schussgewicht (g)</label>
<input type="number" step="0.01" name="shot_weight_g">

<label>Zykluszeit (s)</label>
<input type="number" step="0.01" name="cycle_time_s">

<label>Verpackungseinheit</label>
<input type="number" name="pack_unit">

<div class="form-group">
<label>Status</label>
<select name="status">

<option value="active">Aktiv</option>
<option value="inactive">Inaktiv</option>

</select>
</div>

</div>

<div class="form-actions">

<button type="submit" class="btn-primary">
Artikel speichern
</button>

<a href="{{ url_for('articles.list') }}" class="btn-secondary">
Abbrechen
</a>

</div>

</form>

</div>

{% endblock %}
