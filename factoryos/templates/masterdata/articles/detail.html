{% extends "layout/base.html" %}

{% block content %}

<div class="page-header">

<h2>Artikel</h2>

<div class="page-actions">

<a class="btn-small btn-edit"
   href="{{ url_for('articles.edit', article_id=article.id) }}">
   ✏ Bearbeiten
</a>

<a class="btn-small btn-delete"
   href="{{ url_for('articles.delete', article_id=article.id) }}">
   🗑 Löschen
</a>

</div>

</div>


<div class="detail-card">

<div class="detail-title">

<h3>{{ article.article_no }}</h3>
<span class="detail-subtitle">{{ article.article_name }}</span>

</div>


<div class="detail-grid">

<div class="detail-item">

<label>Artikelnummer</label>
<div class="detail-value">
{{ article.article_no }}
</div>

</div>


<div class="detail-item">

<label>Status</label>

<div class="detail-value">

<span class="status-badge status-{{ article.status }}">
{{ article.status }}
</span>

</div>

</div>


<div class="detail-item full">

<label>Beschreibung</label>

<div class="detail-value">
{{ article.description or "-" }}
</div>

</div>

</div>

</div>


<div class="detail-footer">

<a class="btn-secondary"
   href="{{ url_for('articles.list') }}">
   ← Zurück zur Liste
</a>

</div>

{% endblock %}
