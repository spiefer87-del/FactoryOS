{% extends "layout/base.html" %}

{% block content %}

<h2 style="margin-bottom:25px;">
    Maschine bearbeiten
</h2>

<div class="form-card">

    <form method="POST">

        {% include "masterdata/machines/_form.html" %}

        <div class="form-actions">

            <button
                type="submit"
                class="btn-primary"
            >
                Speichern
            </button>

            <a
                href="{{ url_for('machines.detail', machine_id=machine.id) }}"
                class="btn-secondary"
            >
                Abbrechen
            </a>

        </div>

    </form>

</div>

{% endblock %}
