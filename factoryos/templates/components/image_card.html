<div
    class="image-card"
    data-image-id="{{ image.id }}"
    data-marker-x="{{ image.marker_x if image.marker_x is not none else '' }}"
    data-marker-y="{{ image.marker_y if image.marker_y is not none else '' }}"
    data-marker-px="{{ image.marker_px if image.marker_px is not none else '' }}"
    data-marker-py="{{ image.marker_py if image.marker_py is not none else '' }}"
>

    <div class="image-card-image">

        <img
            src="{{ storage_url(image.image_path) }}"
            alt="Bild"
            loading="lazy"
        >

        {% if image.marker_x is not none and image.marker_y is not none %}

        <div
            class="marker-advanced"
            style="
                left: calc({{ image.marker_x * 100 }}% - 18px);
                top: {{ image.marker_y * 100 }}%;
            "
        >

            <div class="marker-circle">

                {{ marker_number|default(1) }}

            </div>

            <div class="marker-arrow"></div>

        </div>

        {% endif %}

    </div>

    {% if image.description %}

    <div class="image-description">

        {{ image.description }}

    </div>

    {% endif %}

    {% if editable %}

    <div class="image-actions">

        <button
            type="button"
            class="btn-small btn-secondary edit-marker"
            data-image="{{ image.id }}"
        >
            Marker bearbeiten
        </button>

        <button
            type="button"
            class="btn-small btn-delete delete-image"
            data-image="{{ image.id }}"
        >
            Löschen
        </button>

    </div>

    {% endif %}

</div>
