{% extends 'projects/workspace_base.html' %}{% block workspace %}<a href="{{ url_for('projects.dashboard') }}">← Meine Projekte</a><h1>Projekt anlegen</h1><section><form method="post"><input type="hidden" name="access_csrf" value="{{ security_csrf_token() }}"><label>Projektnummer<input name="order_no" maxlength="50" required></label><label>Beschreibung / Ziel<textarea name="description" maxlength="255" required></textarea></label><label>Werkzeug (optional)<select name="tool_id"><option value="">Ohne festes Werkzeug</option>{% for t in tools %}<option value="{{ t.id }}">{{ t.tool_no }} · {{ t.name or '' }}</option>{% endfor %}</select></label><p>Du wirst als Projektleitung und Mitglied eingetragen. Weitere Mitarbeiter lassen sich mit Koordinationsrecht zuordnen.</p><button class="btn-primary">Projekt anlegen</button></form></section>{% endblock %}
