<h6 class="fw-bold">Gesamtzeichnung</h6>

{% if section.drawing_path %}

<div class="drawing-wrapper">

<div class="drawing-stage">

<img
src="{{ url_for('static', filename=section.drawing_path) }}"
class="drawing-img border rounded"
data-section="{{ section.id }}"
data-status="{{ version.status }}">

<svg class="marker-layer"
     data-section="{{ section.id }}"
     viewBox="0 0 100 100"
     preserveAspectRatio="none">

</svg>

</div>
</div>

{% else %}

<div class="alert alert-light border">

Noch keine Zeichnung hochgeladen.

</div>

{% endif %}

{% if version.status == "draft" %}

<form method="post"
enctype="multipart/form-data"
action="{{ url_for('inspection.quality_upload_drawing', section_id=section.id) }}"
class="mt-3">

<input type="file" name="drawing" required>

<button class="btn btn-sm btn-outline-primary">
Zeichnung hochladen
</button>

</form>

{% endif %}
