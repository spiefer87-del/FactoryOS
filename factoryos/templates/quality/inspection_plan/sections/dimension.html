<h6 class="fw-bold">Gesamtzeichnung</h6>

{% if section.drawing_path %}

<div class="drawing-wrapper">

<div class="drawing-stage">

<img
src="{{ url_for('static', filename=section.drawing_path) }}"
class="drawing-img border rounded"
data-section="{{ section.id }}"
data-status="{{ version.status }}">

<svg class="marker-layer"
data-section="{{ section.id }}"
viewBox="0 0 100 100"
preserveAspectRatio="none">

{% for c in section.characteristics %}

<g class="marker"
data-id="{{ c.id }}"
transform="translate({{ c.pos_x*100 }} {{ c.pos_y*100 }})">

<circle r="1.8" class="marker-circle"></circle>

<text class="marker-text">
{{ c.sort_order }}
</text>

</g>

{% endfor %}

</svg>

</div>
</div>

{% endif %}
