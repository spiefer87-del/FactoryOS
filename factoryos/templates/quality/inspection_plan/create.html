{% extends "layout/base.html" %}

{% block content %}

<h2>Prüfplan erstellen</h2>

<div class="form-card">

<form method="POST">

<div class="form-grid">

<!-- Artikel -->
<div class="form-group full">
<label>Artikel</label>
<select id="article-select" name="article_id" required>
<option value="">-- Artikel wählen --</option>
{% for article in articles %}
<option value="{{ article.id }}">
{{ article.article_no }} - {{ article.article_name }}
</option>
{% endfor %}
</select>
</div>

<!-- Werkzeug -->
<div class="form-group full">
<label>Werkzeug</label>
<select id="tool-select" name="tool_id" required>
<option value="">-- zuerst Artikel wählen --</option>
</select>
</div>

</div>

<div class="form-actions">

<button class="btn-primary">
Prüfplan erstellen
</button>

<a href="{{ url_for('inspection.dashboard') }}" class="btn-secondary">
Abbrechen
</a>

</div>

</form>

</div>

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {

    const articleSelect = document.getElementById("article-select");

    let toolTom = new TomSelect("#tool-select", {
        valueField: "id",
        labelField: "text",
        searchField: "text",
        placeholder: "Werkzeug wählen..."
    });

    articleSelect.addEventListener("change", function() {

        const articleId = this.value;

        toolTom.clear();
        toolTom.clearOptions();

        if (!articleId) return;

        fetch("/quality/inspection-plans/tools-by-article/" + articleId)
            .then(res => res.json())
            .then(data => {

                toolTom.addOptions(data);

                if (data.length === 0) {
                    toolTom.addOption({
                        id: "",
                        text: "Keine Werkzeuge vorhanden"
                    });
                }
            });
    });
});
</script>

{% endblock %}
{% endblock %}
