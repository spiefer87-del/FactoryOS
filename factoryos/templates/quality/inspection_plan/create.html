{% extends "layout/base.html" %}

{% block content %}

<h2 style="margin-bottom:25px">Prüfplan erstellen</h2>

<div class="form-card">

<form method="POST">

<div class="form-grid">

<!-- 🔹 Artikel (Pflicht) -->
<div class="form-group full">

<label>Artikel *</label>

<select name="article_id" id="article-select" required>
<option value="">Artikel auswählen...</option>

{% for article in articles %}
<option value="{{ article.id }}">
{{ article.article_no }} - {{ article.article_name }}
</option>
{% endfor %}

</select>

</div>

<!-- 🔹 Werkzeug (optional) -->
<div class="form-group full">

<label>Werkzeug</label>

<select name="tool_id" id="tool-select">

<option value="">Kein Werkzeug zuweisen</option>

{% for tool in tools %}
<option value="{{ tool.id }}">
{{ tool.tool_no }}
</option>
{% endfor %}

</select>

</div>

</div>

<div class="form-actions">

<button type="submit" class="btn-primary">
Prüfplan erstellen
</button>

<a href="{{ url_for('inspection.dashboard') }}" class="btn-secondary">
Abbrechen
</a>

</div>

</form>

</div>

<!-- 🔥 TomSelect -->
<script>
document.addEventListener("DOMContentLoaded", function() {

    const articleSelect = new TomSelect("#article-select", {
        maxItems: 1,
        create: false,
        placeholder: "Artikel suchen..."
    });

    const toolSelect = new TomSelect("#tool-select", {
        maxItems: 1,
        create: false,
        placeholder: "Werkzeug wählen..."
    });

    // 🔥 Wenn Artikel geändert wird → Tools laden
    articleSelect.on("change", function(value) {

        toolSelect.clear();
        toolSelect.clearOptions();

        if (!value) {
            toolSelect.addOption({value: "", text: "Erst Artikel auswählen"});
            toolSelect.refreshOptions(false);
            return;
        }

        fetch(`/quality/inspection-plans/tools-by-article/${value}`)
            .then(response => response.json())
            .then(data => {

                if (data.tools.length === 0) {
                    toolSelect.addOption({
                        value: "",
                        text: "Keine Werkzeuge vorhanden"
                    });
                } else {
                    data.tools.forEach(tool => {
                        toolSelect.addOption({
                            value: tool.id,
                            text: tool.tool_no
                        });
                    });
                }

                toolSelect.refreshOptions(false);
            });

    });

});
</script>
{% endblock %}
