{% if editable %}<section class="qm-module-selector" id="modules"><h2>Modul hinzufügen</h2><div class="qm-module-grid">
{% for type,meta in modules.items() %}<form method="post" class="qm-module-card">{{ fields.security() }}
<button name="add_section_type" value="{{ type }}" type="submit"><span class="qm-module-icon">{{ meta[1] }}</span><strong>{{ meta[0] }}</strong><small>{{ meta[2] }}</small></button>
</form>{% endfor %}</div></section>{% endif %}
