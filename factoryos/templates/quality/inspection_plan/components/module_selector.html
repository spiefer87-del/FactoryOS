<div class="qm-module-selector">

<h4>➕ Modul hinzufügen</h4>

<div class="qm-module-grid">

{% set modules = [
("identification","Identifizierung","🆔"),
("dimension","Maßprüfung","📏"),
("gauge","Lehrenprüfung","🧪"),
("visual","Sichtprüfung","👁"),
("text","Textprüfung","📝")
] %}

{% for type,label,icon in modules %}

<form method="post" class="qm-module-card">

<button
name="add_section_type"
value="{{ type }}"
type="submit">

<div class="qm-module-icon">
{{ icon }}
</div>

<div class="qm-module-title">
{{ label }}
</div>

</button>

</form>

{% endfor %}

</div>
</div>
