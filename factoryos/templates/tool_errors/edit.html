{% extends "layout/base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tool_error.css') }}">
{% endblock %}

{% block content %}

<!-- ===================================== -->
<!-- HEADER -->
<!-- ===================================== -->

<div class="page-header">

    <div>

        <h2>

            Fehlermeldung bearbeiten

        </h2>

        <div class="page-subtitle">

            {{ error.error_no }} · Revision {{ error.revision }}

        </div>

    </div>

</div>

<!-- ===================================== -->
<!-- FORMULAR -->
<!-- ===================================== -->

{% set submit_label = "Änderungen speichern" %}

<form method="POST" class="form-container">

    {% include "tool_errors/_form.html" %}

</form>

<script src="{{ url_for('static', filename='js/tool_error.js') }}"></script>

{% endblock %}
