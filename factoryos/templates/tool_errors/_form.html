<!-- ===================================== -->
<!-- WERKZEUG -->
<!-- ===================================== -->

<div class="form-group">

    <label>Werkzeug *</label>

    <input
        type="text"
        id="toolSearch"
        class="form-control"
        value="{{ error.tool.tool_no if error else '' }}"
        required
    >

    <input
        type="hidden"
        id="tool_id"
        name="tool_id"
        value="{{ error.tool_id if error else '' }}"
    >

    <div id="toolDropdown" class="tool-dropdown"></div>

</div>


<!-- ===================================== -->
<!-- FEHLER -->
<!-- ===================================== -->

<div class="form-group">

    <label>Fehler *</label>

    <select
        id="errorPreset"
        class="form-control preset-select"
    >

        <option value="">-- auswählen --</option>

        {% for p in presets %}

            <option
                value="{{ p.title }}"
                {% if error and error.error_type == p.title %}
                    selected
                {% endif %}
            >
                {{ p.title }}
            </option>

        {% endfor %}

    </select>

    <input
        type=""
        id="error_type"
        name="error_type"
        class="form-control"
        required
        value="{{ error.error_type if error else '' }}"
    >

</div>


<!-- ===================================== -->
<!-- STATUS -->
<!-- ===================================== -->

<div class="form-group">

    <label>Werkzeugstatus</label>

    <select
        id="tool_status"
        name="tool_status"
        class="form-control"
    >

        {% for key, label in TOOL_STATUSES.items() %}

            <option
                value="{{ key }}"
                {% if error and error.tool.tool_status == key %}
                    selected
                {% endif %}
            >
                {{ label }}
            </option>

        {% endfor %}

    </select>

</div>


<!-- ===================================== -->
<!-- BESCHREIBUNG -->
<!-- ===================================== -->

<div class="form-group">

    <label>Beschreibung</label>

    <textarea
        id="description"
        name="description"
        class="form-control"
        rows="5"
    >{{ error.description if error else '' }}</textarea>

</div>


<!-- ===================================== -->
<!-- TEMP / ERROR ID -->
<!-- ===================================== -->

<input
    type="hidden"
    id="temp_id"
    name="temp_id"
>

{% if error %}

<input
    type="hidden"
    id="tool_error_id"
    name="tool_error_id"
    value="{{ error.id }}"
>

{% endif %}


<hr>


<!-- ===================================== -->
<!-- BILDER -->
<!-- ===================================== -->

<div id="imageModule">

    <h3>Bilder</h3>

    <div
        id="imageGallery"
        class="image-gallery"
    >

        {% if error %}

            {% for image in error.images %}

                {% set editable = True %}
                {% set marker_number = loop.index %}

                {% include "components/image_card.html" %}

            {% endfor %}

        {% endif %}

    </div>

</div>


<hr>


<!-- ===================================== -->
<!-- UPLOAD -->
<!-- ===================================== -->

<div
    class="upload-box"
    id="uploadBox"
>

    <div class="image-upload-buttons">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >
    
        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            hidden
        >
    
        <button
            type="button"
            id="selectImageBtn"
            class="btn-secondary"
        >
            📁 Datei auswählen
        </button>
    
        <button
            type="button"
            id="takePhotoBtn"
            class="btn-primary"
        >
            📷 Foto aufnehmen
        </button>
    
    </div>

    <div
        id="previewWrapper"
        class="preview-wrapper"
    >

        <img
            id="previewImage"
            style="display:none;"
        >

    </div>

    <textarea
        id="imageDescription"
        class="form-control"
        placeholder="Beschreibung zum Bild"
    ></textarea>

    <input
        type="hidden"
        id="marker_x"
    >

    <input
        type="hidden"
        id="marker_y"
    >

    <input
        type="hidden"
        id="marker_px"
        name="marker_px"
    >

    <input
        type="hidden"
        id="marker_py"
        name="marker_py"
    >

    <button
        type="button"
        id="uploadBtn"
        class="btn-primary"
    >
        Bild speichern
    </button>

</div>


<hr>

<div id="markerEditorModal" class="modal hidden">

    <div class="modal-content marker-editor">

        <h3>Marker bearbeiten</h3>

        <div
            id="markerEditorWrapper"
            class="preview-wrapper"
        >

            <img
                id="markerEditorImage"
                draggable="false"
            >

        </div>

        <div class="form-group">

            <label>Beschreibung</label>
        
            <textarea
                id="markerEditorDescription"
                class="form-control"
                rows="4"
            ></textarea>
        
        </div>

        <div class="modal-actions">

            <button
                type="button"
                id="saveMarkerBtn"
                class="btn-primary"
            >
                Marker speichern
            </button>

            <button
                type="button"
                id="cancelMarkerBtn"
                class="btn-secondary"
            >
                Abbrechen
            </button>

        </div>

    </div>

</div>


<!-- ===================================== -->
<!-- BUTTON -->
<!-- ===================================== -->

<button
    type="submit"
    class="btn-success"
>

    {{ submit_label if submit_label else "Tool Error speichern" }}

</button>
