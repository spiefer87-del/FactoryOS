<!-- ===================================== -->
<!-- WERKZEUG -->
<!-- ===================================== -->

<div class="form-group">

    <label>Werkzeug *</label>

    <input
        type="text"
        id="toolSearch"
        class="form-control"
        value="{{ error.tool.tool_no if error else '' }}"
        required
    >

    <input
        type="hidden"
        id="tool_id"
        name="tool_id"
        value="{{ error.tool_id if error else '' }}"
    >

    <div id="toolDropdown"></div>

</div>


<!-- ===================================== -->
<!-- FEHLER -->
<!-- ===================================== -->

<div class="form-group">

    <label>Fehler *</label>

    <select id="errorPreset" class="form-control">

        <option value="">-- auswählen --</option>

        {% for p in presets %}

            <option
                value="{{ p.title }}"
                {% if error and error.error_type == p.title %}
                    selected
                {% endif %}
            >
                {{ p.title }}
            </option>

        {% endfor %}

    </select>

    <input
        type="text"
        id="error_type"
        name="error_type"
        class="form-control"
        required
        value="{{ error.error_type if error else '' }}"
    >

</div>


<!-- ===================================== -->
<!-- STATUS -->
<!-- ===================================== -->

<div class="form-group">

    <label>Werkzeugstatus</label>

    <select name="tool_status">

        {% for key, label in TOOL_STATUSES.items() %}

            <option
                value="{{ key }}"
                {% if error and error.tool.tool_status == key %}
                    selected
                {% endif %}
            >
                {{ label }}
            </option>

        {% endfor %}

    </select>

</div>


<!-- ===================================== -->
<!-- BESCHREIBUNG -->
<!-- ===================================== -->

<div class="form-group">

    <label>Beschreibung</label>

    <textarea
        name="description"
        class="form-control"
    >{{ error.description if error else '' }}</textarea>

</div>


<!-- ===================================== -->
<!-- TEMP ID -->
<!-- ===================================== -->

<input
    type="hidden"
    id="temp_id"
    name="temp_id"
>


<hr>


<!-- ===================================== -->
<!-- BILDER -->
<!-- ===================================== -->

<div id="imageModule">

    <h3>Bilder hinzufügen</h3>

    <div
        id="imageGallery"
        class="image-gallery"
    >

        {% if error %}

            {% for img in error.images %}

            <div class="image-card">

                <img
                    src="{{ url_for('static', filename=img.image_path) }}"
                    class="gallery-image"
                >

                {% if img.description %}

                <div class="image-description">

                    {{ img.description }}

                </div>

                {% endif %}

            </div>

            {% endfor %}

        {% endif %}

    </div>

</div>


<hr>


<!-- ===================================== -->
<!-- UPLOAD -->
<!-- ===================================== -->

<div
    class="upload-box"
    id="uploadBox"
>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <div
        id="previewWrapper"
        class="preview-wrapper"
    >

        <img
            id="previewImage"
            style="display:none;"
        >

    </div>

    <textarea
        id="imageDescription"
        class="form-control"
        placeholder="Beschreibung zum Bild"
    ></textarea>

    <input type="hidden" id="marker_x">
    <input type="hidden" id="marker_y">

    <input
        type="hidden"
        id="marker_px"
        name="marker_px"
    >

    <input
        type="hidden"
        id="marker_py"
        name="marker_py"
    >

    <button
        type="button"
        id="uploadBtn"
        class="btn-primary"
    >

        Bild speichern

    </button>

</div>


<hr>


<!-- ===================================== -->
<!-- BUTTON -->
<!-- ===================================== -->

<button
    type="submit"
    class="btn-success"
>

    {{ submit_label if submit_label else "Tool Error speichern" }}

</button>
