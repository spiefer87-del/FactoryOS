{% extends "layout/base.html" %}

{% block content %}

<h2>Tool Error erfassen</h2>

<form method="POST" class="form-container">

    <!-- Werkzeug auswählen -->
    <div class="form-group">
        <label for="toolSearch">Werkzeugnummer *</label>

        <!-- sichtbares Suchfeld -->
        <input type="text"
            id="toolSearch"
            class="form-control"
            placeholder="Werkzeug suchen..."
            autocomplete="off"
            required>

        <!-- hidden für echte ID -->
        <input type="hidden" name="tool_id" id="tool_id" required>

        <!-- Dropdown -->
        <div id="toolDropdown" class="dropdown-list"></div>
    </div>

    <!-- Fehlerart -->
    <div class="form-group">
        <label for="error_type">Fehler *</label>
        <input type="text"
               name="error_type"
               id="error_type"
               class="form-control"
               required>
    </div>

    <!-- Beschreibung -->
    <div class="form-group">
        <label for="description">Beschreibung</label>
        <textarea name="description"
                  id="description"
                  class="form-control"
                  rows="4"></textarea>
    </div>

    <!-- Submit -->
    <div class="form-actions">
        <button type="submit" class="btn-primary">
            Speichern
        </button>

        <a href="{{ url_for('tool_error.list') }}" class="btn-secondary">
            Abbrechen
        </a>
    </div>

</form>

<!-- 🔥 Live Filter Script -->
<script>
const input = document.getElementById("toolSearch");
const dropdown = document.getElementById("toolDropdown");
const hiddenInput = document.getElementById("tool_id");

let timeout = null;

input.addEventListener("input", function () {

    clearTimeout(timeout);

    const query = this.value;

    hiddenInput.value = ""; // reset

    if (query.length < 2) {
        dropdown.innerHTML = "";
        return;
    }

    timeout = setTimeout(() => {

        fetch(`/masterdata/tools/api/search?q=${query}`)
            .then(res => res.json())
            .then(data => {

                dropdown.innerHTML = "";

                data.results.forEach(tool => {

                    const div = document.createElement("div");
                    div.classList.add("dropdown-item");
                    div.textContent = tool.text;

                    div.onclick = () => {
                        input.value = tool.text;
                        hiddenInput.value = tool.id;
                        dropdown.innerHTML = "";
                    };

                    dropdown.appendChild(div);
                });

            });

    }, 300);
});

// Klick außerhalb → schließen
document.addEventListener("click", function(e) {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.innerHTML = "";
    }
});
</script>

{% endblock %}
