{% extends "layout/base.html" %}

{% block content %}

<h2>Tool Error erfassen</h2>

<form method="POST" class="form-container">

    <!-- Werkzeug auswählen -->
    <div class="form-group">
        <label for="toolSearch">Werkzeugnummer *</label>

        <input type="text"
               id="toolSearch"
               class="form-control"
               placeholder="Werkzeug suchen..."
               autocomplete="off"
               >

        <select name="tool_id"
                id="toolSelect"
                class="form-control"
                size="6"
                required>
            {% for tool in tools %}
                <option value="{{ tool.id }}">
                    {{ tool.tool_no }} - {{ tool.description or '' }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Fehlerart -->
    <div class="form-group">
        <label for="error_type">Fehler *</label>
        <input type="text"
               name="error_type"
               id="error_type"
               class="form-control"
               required>
    </div>

    <!-- Beschreibung -->
    <div class="form-group">
        <label for="description">Beschreibung</label>
        <textarea name="description"
                  id="description"
                  class="form-control"
                  rows="4"></textarea>
    </div>

    <!-- Submit -->
    <div class="form-actions">
        <button type="submit" class="btn-primary">
            Speichern
        </button>

        <a href="{{ url_for('tool_error.list') }}" class="btn-secondary">
            Abbrechen
        </a>
    </div>

</form>

<!-- 🔥 Live Filter Script -->
<script>
const searchInput = document.getElementById("toolSearch");
const select = document.getElementById("toolSelect");

// 🔥 Original speichern
const allOptions = Array.from(select.options);

searchInput.addEventListener("input", function () {

    const filter = this.value.toLowerCase();

    // Select leeren
    select.innerHTML = "";

    // Gefilterte Optionen neu einfügen
    const filtered = allOptions.filter(option =>
        option.text.toLowerCase().includes(filter)
    );

    filtered.forEach(option => select.appendChild(option));

    // 🔥 optional: erstes Element automatisch wählen
    if (select.options.length > 0) {
        select.selectedIndex = 0;
    }

});
</script>

{% endblock %}
