{% extends "layout/base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tool_error.css') }}">
{% endblock %}

{% block content %}

<h2>Tool Error erfassen</h2>

<form method="POST" enctype="multipart/form-data" class="form-container">

    <!-- 🔧 Werkzeug -->
    <div class="form-group">
        <label for="toolSearch">Werkzeugnummer *</label>

        <input type="text"
               id="toolSearch"
               class="form-control"
               placeholder="Werkzeug suchen..."
               autocomplete="off"
               required>

        <input type="hidden" name="tool_id" id="tool_id" required>

        <div id="toolDropdown" class="tool-dropdown"></div>
    </div>

    <!-- ⚠️ Fehler -->
    <div class="form-group">
        <label for="error_type">Fehler *</label>

        <select id="errorPreset" class="form-control preset-select">
            <option value="">-- Fehler auswählen --</option>

            {% for p in presets %}
                <option value="{{ p.title }}">{{ p.title }}</option>
            {% endfor %}
        </select>

        <input type="text"
               name="error_type"
               id="error_type"
               class="form-control"
               placeholder="Oder eigenen Fehler eingeben..."
               required>
    </div>

    <!-- 📝 Beschreibung -->
    <div class="form-group">
        <label for="description">Beschreibung</label>
        <textarea name="description"
                  id="description"
                  class="form-control"
                  rows="4"></textarea>
    </div>

    <!-- 📸 Bild + Marker -->
    <div class="form-group">
        <label>Bilder mit Marker</label>

        <input type="file" id="imageInput" accept="image/*">

        <div id="imagePreviewContainer" class="image-preview-container"></div>
    </div>

    <!-- ✅ Buttons -->
    <div class="form-actions">
        <button type="submit" class="btn-primary">Speichern</button>

        <a href="{{ url_for('tool_error.list') }}" class="btn-secondary">
            Abbrechen
        </a>
    </div>

</form>

<!-- 🔥 JS -->
<script src="{{ url_for('static', filename='js/tool_error.js') }}"></script>


{% endblock %}
