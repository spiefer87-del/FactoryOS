{% extends "layout/base.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tool_error.css') }}">
{% endblock %}

{% block content %}

<h2>Tool Error erfassen</h2>

<form method="POST" enctype="multipart/form-data" class="form-container">

    <!-- 🔧 Werkzeug -->
    <div class="form-group">
        <label>Werkzeugnummer *</label>

        <input type="text" id="toolSearch" class="form-control" autocomplete="off" required>
        <input type="hidden" name="tool_id" id="tool_id" required>

        <div id="toolDropdown" class="tool-dropdown"></div>
    </div>

    <!-- ⚠️ Fehler -->
    <div class="form-group">
        <label>Fehler *</label>

        <select id="errorPreset" class="form-control">
            <option value="">-- Fehler auswählen --</option>
            {% for p in presets %}
                <option value="{{ p.title }}">{{ p.title }}</option>
            {% endfor %}
        </select>

        <input type="text" name="error_type" id="error_type" class="form-control" required>
    </div>

    <!-- 📝 Beschreibung -->
    <div class="form-group">
        <label>Beschreibung</label>
        <textarea name="description" class="form-control"></textarea>
    </div>

    <!-- 📸 BILDER -->
    <div class="form-group">
        <label>Bilder + Marker</label>

        <input type="file" id="imageInput" name="images" multiple accept="image/*">

        <div id="imagePreviewContainer"></div>
    </div>

    <button type="submit" class="btn-primary">Speichern</button>

</form>

<script src="{{ url_for('static', filename='js/tool_error.js') }}"></script>

{% endblock %}
