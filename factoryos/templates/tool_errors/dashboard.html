{% extends "layout/base.html" %}

{% block content %}

<h2>Tool Errors</h2>

<div class="dashboard-grid">

    <a href="{{ url_for('tool_error.list_errors') }}"
       class="dashboard-card">

        <div class="card-icon">📋</div>

        <div class="card-title">
            Fehlerliste
        </div>

        <div class="card-desc">
            Alle Tool Errors anzeigen
        </div>

    </a>

    <a href="{{ url_for('tool_error.create') }}"
       class="dashboard-card">

        <div class="card-icon">➕</div>

        <div class="card-title">
            Fehler melden
        </div>

        <div class="card-desc">
            Neue Fehlermeldung erfassen
        </div>

    </a>

    <a href="{{ url_for('tool_error.import_errors') }}"
       class="dashboard-card">

        <div class="card-icon">📥</div>

        <div class="card-title">
            Excel Import
        </div>

        <div class="card-desc">
            Tool Errors aus Excel importieren
        </div>

    </a>

</div>

{% endblock %}
