{% extends "layout/base.html" %}

{% block content %}

<h2>Auftrag {{ order.order_no }}</h2>

<p>Artikel: {{ order.article }}</p>
<p>Status: {{ order.status }}</p>
<p>Menge: {{ order.target_qty }}</p>

<a href="{{ url_for('orders.edit', order_id=order.id) }}" class="btn-primary">
Bearbeiten
</a>

<a href="{{ url_for('orders.delete', order_id=order.id) }}" class="btn-danger">
Löschen
</a>
{% endblock %}
