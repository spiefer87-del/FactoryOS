{% extends "layout/base.html" %}

{% block content %}

<h2>Auftrag bearbeiten</h2>

<form method="POST" class="form-container">

<div class="form-group">
<label>Artikelnummer</label>
<input type="text" id="order-article" name="article" list="order-articles" value="{{ request.form.get('article',order.article or '') }}">
</div>

<div class="form-group">
<label>Artikelname</label>
<input type="text" name="article_name" value="{{ request.form.get('article_name',order.article_name or '') }}">
</div>

<div class="form-group">
<label>Beschreibung</label>
<textarea name="description">{{ request.form.get('description',order.description or '') }}</textarea>
</div>

<div class="form-group">
<label>Standort</label>
<input type="text" name="location" value="{{ request.form.get('location',order.location or '') }}">
</div>

<div class="form-group">
<label>Zielmenge</label>
<input type="number" name="target_qty" value="{{ request.form.get('target_qty',order.target_qty) }}">
</div>

<div class="form-group">
<label>Status</label>
<select name="status">
{% if order.status not in ['offen','in_arbeit','fertig','gesperrt'] %}
<option value="{{ order.status }}" selected>{{ order.status }}</option>
{% endif %}

<option value="offen" {% if order.status=="offen" %}selected{% endif %}>
Offen
</option>

<option value="in_arbeit" {% if order.status=="in_arbeit" %}selected{% endif %}>
In Arbeit
</option>

<option value="fertig" {% if order.status=="fertig" %}selected{% endif %}>
Fertig
</option>

<option value="gesperrt" {% if order.status=="gesperrt" %}selected{% endif %}>
Gesperrt
</option>

</select>
</div>

{% include "orders/cycle_field.html" %}
<button class="btn-primary">Speichern</button>

</form>

{% endblock %}
