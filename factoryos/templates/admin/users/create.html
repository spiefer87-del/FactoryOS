{% extends "layout/base.html" %}

{% block content %}

<h2>Neuen Benutzer anlegen</h2>

<div class="form-container">

<form method="post">
<input type="hidden" name="access_csrf" value="{{ security_csrf_token() }}">

<div class="form-group">
<label>Benutzername</label>
<input type="text" name="username" required>
</div>

<div class="form-group">
<label>Passwort (12–128 Zeichen)</label>
<input type="password" name="password" minlength="12" maxlength="128" required>
</div>

<div class="form-group">

<label>Rolle</label>

<select name="role_id">

{% for role in roles if can_assign_role(role) %}

<option value="{{ role.id }}">

{{ role.name }}

</option>

{% endfor %}

</select>

</div>

</div>

<button class="btn-primary">
Benutzer anlegen
</button>

</form>

</div>

{% endblock %}
