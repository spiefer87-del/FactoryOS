<header class="navbar">

    <div class="navbar-left">

        <!-- Sidebar Toggle (nur Mobile sichtbar) -->
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            ☰
        </button>

        <span class="navbar-logo">
            FactoryOS
        </span>

    </div>


    <div class="navbar-right">

        {% if current_user.is_authenticated %}<a class="navbar-user profile-entry" href="{{ url_for('profile.settings') }}" title="Mein Profil und persönliche Einstellungen"><span>{{ current_user.username }}</span><small>Mein Profil</small></a>{% endif %}

        <a class="logout-btn" href="{{ url_for('auth.logout') }}">
            Logout
        </a>

    </div>

</header>
